name: Keep Deployments Alive

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  wake-dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Wake KeepAlive dashboard
        run: |
          python scripts/wake_streamlit.py https://keepalive.streamlit.app